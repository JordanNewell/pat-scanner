<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" role="img" aria-label="PAT Scanner logo">
  <title>PAT Scanner</title>

  <!-- NEWELL N mark: three ascending monoline bars + white diagonal -->
  <g id="n-mark" fill="#00FF41">
    <rect x="60"  y="95" width="8" height="25" rx="4"/>
    <rect x="78"  y="75" width="8" height="45" rx="4"/>
    <rect x="96"  y="55" width="8" height="65" rx="4"/>
  </g>
  <line x1="50" y1="120" x2="138" y2="45"
        stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Radar ring (outer + inner) -->
  <circle cx="100" cy="225" r="75" fill="none" stroke="#00FF41" stroke-width="2"/>
  <circle cx="100" cy="225" r="55" fill="none" stroke="#1AFF72" stroke-width="1" opacity="0.5"/>

  <!-- Crosshair (gap through padlock zone r<26) -->
  <g stroke="#1AFF72" stroke-width="1" opacity="0.6">
    <line x1="25"  y1="225" x2="69"  y2="225"/>
    <line x1="131" y1="225" x2="175" y2="225"/>
    <line x1="100" y1="150" x2="100" y2="199"/>
    <line x1="100" y1="251" x2="100" y2="300"/>
  </g>

  <!-- Padlock: shackle + body + keyhole -->
  <path d="M 90 221 V 211 a 10 10 0 0 1 20 0 V 221"
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="84" y="220" width="32" height="26" rx="4" fill="#FFFFFF"/>
  <circle cx="100" cy="231" r="2.5" fill="#0A0A0A"/>
  <rect x="99" y="231" width="2" height="6" fill="#0A0A0A"/>
</svg>
